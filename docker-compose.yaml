
services:
  app:
    build: .
    ports:
      - "3000:8080"
    environment:
      - DATABASE_URI=mongodb://root:example@localhost:27017/studinsight?authSource=admin
      - PORT=8080
      - ACCESS_TOKEN_SECRET=98e735def7d4a7a77090fc7cca60f843ba0f137d6a81a38fe74e52e7a6f6944b
      - REFRESH_TOKEN_SECRET=5710960cb0f273e9104b54e59e1d2527da27a94e47da2c75d288eabae57c8ca8
    depends_on:
      - mongodb

  mongodb:
    image: mongo:latest
    container_name: mongodb-local
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - /home/basile/Documents/programmation/web/studinsight/docker/mongo-data:/data/db

volumes:
  mongo-data: